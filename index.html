<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바이브 카페 - 주문서</title>

  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 페이지 상단: 카페 헤더 ===== -->
  <header class="cafe-header">
    <!-- 카페 로고 이모지 -->
    <div class="cafe-logo" aria-label="카페 로고">☕</div>

    <!-- 카페 이름 -->
    <h1 class="cafe-name">바이브 카페</h1>

    <!-- 부제 -->
    <p class="cafe-subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- ===== 메인 콘텐츠: 주문서 ===== -->
  <main class="order-container">

    <!--
      novalidate: 브라우저 기본 유효성 검사를 끄고,
      JavaScript에서 직접 검사하기 위해 설정
    -->
    <form id="order-form" novalidate>

      <!-- ───── 1. 이름 (필수) ───── -->
      <div class="form-group">
        <label for="customer-name">
          이름 <span class="required" aria-label="필수">*</span>
        </label>
        <input
          type="text"
          id="customer-name"
          name="customer-name"
          placeholder="이름을 입력하세요"
          autocomplete="name"
        />
        <!-- JavaScript가 채울 오류 메시지 영역 -->
        <span class="error-message" id="name-error" aria-live="polite"></span>
      </div>

      <!-- ───── 2. 전화번호 ───── -->
      <div class="form-group">
        <label for="customer-tel">전화번호</label>
        <input
          type="tel"
          id="customer-tel"
          name="customer-tel"
          placeholder="010-0000-0000"
          autocomplete="tel"
        />
      </div>

      <!-- ───── 3. 음료 선택 (드롭다운) ───── -->
      <div class="form-group">
        <label for="drink-select">음료 선택</label>
        <select id="drink-select" name="drink-select">
          <!-- 기본 안내 항목 (가격 없음) -->
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>

          <!-- 각 음료 옵션: data-price에 기본 가격(원) 저장 -->
          <option value="americano"   data-price="3500">아메리카노 3,500원</option>
          <option value="caffe-latte" data-price="4000">카페라떼 4,000원</option>
          <option value="caffe-mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
        </select>
      </div>

      <!-- ───── 4. 사이즈 (라디오) ───── -->
      <fieldset class="form-group">
        <legend>사이즈</legend>

        <!-- S 사이즈: 추가 금액 없음 -->
        <label class="radio-label">
          <input
            type="radio"
            id="size-s"
            name="size"
            value="s"
            data-price="0"
          />
          S <span class="price-tag">+0원</span>
        </label>

        <!-- M 사이즈: 기본 선택, +500원 -->
        <label class="radio-label">
          <input
            type="radio"
            id="size-m"
            name="size"
            value="m"
            data-price="500"
            checked
          />
          M <span class="price-tag">+500원</span>
        </label>

        <!-- L 사이즈: +1,000원 -->
        <label class="radio-label">
          <input
            type="radio"
            id="size-l"
            name="size"
            value="l"
            data-price="1000"
          />
          L <span class="price-tag">+1,000원</span>
        </label>
      </fieldset>

      <!-- ───── 5. 추가 옵션 (체크박스) ───── -->
      <fieldset class="form-group">
        <legend>추가 옵션</legend>

        <!-- 샷 추가 -->
        <label class="checkbox-label">
          <input
            type="checkbox"
            id="option-shot"
            name="options"
            value="shot"
            data-price="500"
          />
          샷 추가 <span class="price-tag">+500원</span>
        </label>

        <!-- 크림 추가 -->
        <label class="checkbox-label">
          <input
            type="checkbox"
            id="option-cream"
            name="options"
            value="cream"
            data-price="500"
          />
          크림 추가 <span class="price-tag">+500원</span>
        </label>

        <!-- 시럽 추가 -->
        <label class="checkbox-label">
          <input
            type="checkbox"
            id="option-syrup"
            name="options"
            value="syrup"
            data-price="300"
          />
          시럽 추가 <span class="price-tag">+300원</span>
        </label>

        <!-- 디카페인 (추가 금액 없음) -->
        <label class="checkbox-label">
          <input
            type="checkbox"
            id="option-decaf"
            name="options"
            value="decaf"
            data-price="0"
          />
          디카페인 <span class="price-tag">+0원</span>
        </label>
      </fieldset>

      <!-- ───── 6. 수량 ───── -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="1"
          max="10"
          value="1"
        />
      </div>

      <!-- ───── 7. 요청사항 ───── -->
      <div class="form-group">
        <label for="request">요청사항</label>
        <textarea
          id="request"
          name="request"
          rows="3"
          placeholder="요청사항을 입력하세요 (예: 얼음 적게, 뜨겁게 등)"
        ></textarea>
      </div>

      <!-- ───── 8. 예상 금액 표시 영역 ───── -->
      <!--
        JavaScript가 실시간으로 금액을 계산해서
        #estimated-price 텍스트를 업데이트함
      -->
      <div class="price-display">
        <span>예상 금액: </span>
        <strong id="estimated-price">0원</strong>
      </div>

      <!-- ───── 9. 주문하기 버튼 ───── -->
      <button type="submit" id="submit-btn" class="btn btn-primary">
        주문하기
      </button>

      <!-- ───── 10. 다시 작성 버튼 ───── -->
      <button type="reset" id="reset-btn" class="btn btn-secondary">
        다시 작성
      </button>

    </form><!-- /#order-form -->

    <!-- ───── 11. 주문 확인 메시지 영역 (처음에는 숨김) ───── -->
    <!--
      JavaScript가 주문 완료 후 숨김을 해제하고
      주문 내용을 이 영역에 채워 넣음
    -->
    <div id="order-confirmation" class="order-confirmation hidden" aria-live="polite">
      <!-- 주문 완료 메시지가 여기에 동적으로 삽입됨 -->
    </div>

  </main><!-- /.order-container -->

  <!-- Supabase JS v2 CDN (script.js보다 먼저 로드해야 supabase 전역 객체를 사용할 수 있음) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 자바스크립트 연결 (DOM이 모두 로드된 후 실행되도록 body 끝에 배치) -->
  <script src="script.js"></script>
</body>
</html>
